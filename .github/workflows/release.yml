name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump (auto derives it from conventional commits)
        type: choice
        default: auto
        options:
          - auto
          - patch
          - minor
          - major
      dry-run:
        description: Preview the release without committing, tagging or publishing
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    name: Release
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 20
    permissions:
      # Push the release commit and tag, create the GitHub release
      contents: write
      # npm trusted publishing
      id-token: write
    env:
      SPECIFIER: ${{ inputs.bump != 'auto' && inputs.bump || '' }}
      DRY_RUN: ${{ inputs.dry-run && '--dry-run' || '' }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history and tags to find the previous release and its commits
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: 'package.json'
          cache: npm

      - name: Update npm for trusted publishing
        run: npm install --global npm@^11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Lint and test the library
        run: npx nx run-many -t lint test -p contentful-rich-text-angular-renderer

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Version, changelog, tag and GitHub release
        run: npx nx release $SPECIFIER --skip-publish $DRY_RUN

      - name: Build the library
        run: npx nx build contentful-rich-text-angular-renderer --skip-nx-cache

      - name: Publish to npm
        run: npx nx release publish $DRY_RUN
